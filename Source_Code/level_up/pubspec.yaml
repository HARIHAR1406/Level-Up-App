name: level_up
description: Level Up - Personal toolkit launcher
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  share_plus: ^7.2.1
  intl: ^0.19.0
  pdf: ^3.11.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/levelup-logo-legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/levelup-adaptive-background.png"
  adaptive_icon_foreground: "assets/images/levelup-adaptive-foreground.png"
